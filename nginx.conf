server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Fallback: unknown paths serve index.html so the React app can handle them
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must always be revalidated, so users get new deploys
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets (use /static/ for Create React App)
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}